name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Portal literals（门户清单单一真源）
        run: pnpm --filter @autional/secret-console exec autional-check-portal-literals --root .

      - name: Typecheck + build
        run: pnpm build

      # 无障碍闸门（AC C-28 / ui-denominator U4）：jsx-a11y recommended，0 error/warn 才算过。
      - name: A11y lint
        run: pnpm --filter @autional/secret-console run lint:a11y

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @autional/secret-console exec playwright install --with-deps chromium

      - name: E2E smoke (mock mode)
        run: pnpm --filter @autional/secret-console test:e2e

      # 认证流程：本地假 OIDC 提供方，真验 PKCE(state/nonce/换票/落会话/刷新恢复)
      - name: E2E auth (fake OIDC)
        run: pnpm --filter @autional/secret-console test:e2e:auth
