name: Live SHA

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compare live version with HEAD (.com=SHA / .cn=mtime)
        run: |
          node <<'NODE'
          const sites = [
            { url: 'https://secret.autional.com/', mode: 'sha' },
            { url: 'https://secret.autional.cn/', mode: 'mtime' },
          ];
          const expected = process.env.GITHUB_SHA;
          const SHA_RE = /VITE_VERCEL_GIT_COMMIT_SHA:"([a-f0-9]{7,40})"/;
          const MTIME_TOLERANCE_MS = 15 * 60 * 1000;
          const ATTEMPTS = 60;
          const DELAY_MS = 15_000;

          function gitCommitTime() {
            const { execFileSync } = require('node:child_process');
            return Number(execFileSync('git', ['show', '-s', '--format=%ct', expected], { encoding: 'utf8' }).trim()) * 1000;
          }

          async function liveInfo(site) {
            const res = await fetch(site.url);
            const html = await res.text();
            const asset = html.match(/assets\/index-[^"']+\.js/)?.[0];
            if (!asset) throw new Error(`no bundle asset: ${site.url}`);
            if (site.mode === 'mtime') {
              const lastModified = res.headers.get('last-modified');
              if (!lastModified) throw new Error(`no Last-Modified: ${site.url}`);
              return new Date(lastModified).getTime();
            }
            const js = await (await fetch(new URL(asset, site.url))).text();
            const sha = js.match(SHA_RE)?.[1];
            if (!sha) throw new Error(`no SHA in bundle: ${site.url}`);
            return sha;
          }

          (async () => {
            const expectedTime = gitCommitTime();
            for (let attempt = 1; attempt <= ATTEMPTS; attempt += 1) {
              let failed = 0;
              for (const site of sites) {
                try {
                  const live = await liveInfo(site);
                  const ok = site.mode === 'sha'
                    ? live === expected
                    : live >= expectedTime - MTIME_TOLERANCE_MS;
                  if (!ok) failed += 1;
                  console.log(`${ok ? 'PASS' : 'WAIT'} ${site.url} live=${live} head=${expected} (${site.mode})`);
                } catch (err) {
                  failed += 1;
                  console.log(`WAIT ${site.url} ${err.message}`);
                }
              }
              if (!failed) process.exit(0);
              if (attempt < ATTEMPTS) {
                console.log(`deploy not ready (attempt ${attempt}/${ATTEMPTS}); retrying in ${DELAY_MS / 1000}s`);
                await new Promise((resolve) => setTimeout(resolve, DELAY_MS));
              }
            }
            process.exit(1);
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          NODE
